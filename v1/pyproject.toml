[project]
name = "v1"
version = "0.1.0"
description = "v1 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.8.1"
]

[project.scripts]
v1 = "v1.main:run"
run_crew = "v1.main:run"
train = "v1.main:train"
replay = "v1.main:replay"
test = "v1.main:test"
run_with_trigger = "v1.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
