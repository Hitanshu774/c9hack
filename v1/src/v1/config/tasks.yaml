feature_conversion_task:
  description: >
    You are NOT allowed to invent, infer, or reinterpret.
    You may only restate the provided semantics using the given definitions.

        VALORANT Team Strategy Semantic Definitions

    Use only these definitions when interpreting or generating text.
    Do not invent new meanings or override these terms.

    "Entry Fragger": "Player with entry_attempts_per_round >72%. Leads site executes.",
    "Duelist": "Player with duel_win_pct >52%. Primary gunfighter.",
    "Anchor": "Player with post_plant_kd >1.15. Site defender/holder.",
    "Flex": "Utility player. No elite specialized stats.",
    
    "Aggressive": "avg_entry_rate >70%. Multiple entry fraggers.",
    "Balanced": "avg_entry_rate 60-70%. Mixed roles.",
    "Methodical": "avg_entry_rate <60%. Lower aggression.",
    
    "entry_attempts_per_round": "% rounds with first damage. Aggression measure.",
    "duel_win_pct": "Kills/(Kills+Deaths). Aim skill.",
    "kd_site": "Kills/Deaths on planted rounds. Site holding.",
    "dpr": "Damage Per Round. Damage output.",
    
    "star_entry": "Highest entry_attempts_per_round player.",
    "strengths": "Top 2-4 standout metrics vs pro benchmarks.",
    "avg_entry_rate": "Team average entry_attempts_per_round."
    Rules:
    - These definitions are authoritative.
    - Do not reinterpret labels.
    - Do not introduce new strategic concepts.
    - Do not invent statistics or numeric values.
    - If a concept is not explicitly present, state "unknown".


    If a concept is not present, state it as unknown.
    You MUST load the predefined terms by calling the tool
    json_reader_tool and read the following json files:
    C:\Users\hitan\OneDrive\Desktop\c9\c9hack\v1\src\v1\pro_player_qualitative_analysis.json


    Do not proceed without calling the tool and compulsorily stick to the terms mentioned in the tool
  expected_output: >
    A deep knowledge of all the predefined terms in context of {topic}
  agent: semantic_interpreter

generation_task:
  description: >
    You are a dataset generator.
    Do not analyze strategy.
    Do not introduce new ideas.
    Only convert the provided semantic profile into clean comprehensive dataset

  expected_output: >
    A detailed dataset covering all relevant aspects of {topic} based strictly on the predefined terms.
    Approach the task methodically, ensuring each section is comprehensive and informative, without adding any external knowledge.
    The data should be in markdown comprehensive format. Try to be more explanatory. 
    
  agent: Dataset_Writer
  context: 
      - feature_conversion_task
