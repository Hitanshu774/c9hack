feature_conversion_task:
  description: >
    You are NOT allowed to invent, infer, or reinterpret.
    You may only restate the provided semantics using the given definitions.

        VALORANT Team Strategy Semantic Definitions

    Use only these definitions when interpreting or generating text.
    Do not invent new meanings or override these terms.

    1. **avg_round_duration** (118.8s): Average active round time (excluding 30s buy phase)
      - Aggressive (>110s): Control/grind style, post-plant battles
      - Balanced (80-110s): Standard execution
      - Conservative (<80s): Fast rushes, quick resolutions

    2. **early_utility_rate** (0.195): % rounds with utility usage in first 15s
      - Measures opening aggression vs utility preservation

    3. **first_contact_time** (15.0s): Average time to first damage event
      - Late (≥14.5s): Info gathering, patient setups
      - Early (<14.5s): High-risk immediate engagements

    4. **site_hit_freq** (0.68): % attack rounds with bomb plant
      - Elite teams: 0.70+ (consistent site execution)
      - Balanced: 0.55-0.75 (situational plants)

    5. **pistol_conv** (0.8): % pistol round wins converted to next round win
      - Perfect (1.0): Elite economy management
      - Elite: ≥0.8 (force buys win next pistol)

    6. **utility_share** (0.006): % total damage from utility (molotovs, etc.)
      - Weapon-focused: <0.01 (raw aim duels)
      - Utility-dominant: >0.015 (smart fragging)

    7. **post_plant** (1.0): % planted rounds won
      - Perfect (1.0): Elite post-plant execution
      - Vulnerable (<0.7): DEF retake specialists counter

    8. **retake_rate** (0.431): % successful DEF retakes after plant
      - vs hold_rate (0.569): Balance of retake vs site-hold success

    9. **def_aggression** (1.0): % DEF rounds with damage dealt (proactive)
      - Passive defense: Anchor sites, trade passively
      - Aggressive defense: Proactive engagements

    10. **collapse_rate** (0.294): % rounds where first-kill team loses
        - Strong stability: <0.25 (momentum maintained)
        - Vulnerable: >0.35 (first blood reversed)
    Rules:
    - These definitions are authoritative.
    - Do not reinterpret labels.
    - Do not introduce new strategic concepts.
    - Do not invent statistics or numeric values.
